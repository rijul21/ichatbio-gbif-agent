test_cases:
  - user_message: "How many bird records are there in Germany?"
    expected_description: "Count of bird occurrence records from Germany"

  - user_message: "Count of mammal observations in Brazil by year"
    expected_description: "Breakdown of mammal occurrences in Brazil by year"

  - user_message: "How many insect specimens does GBIF have from Japan?"
    expected_description: "Count of insect specimen records from Japan"

  - user_message: "Give me a breakdown of butterfly records in France by basis of record"
    expected_description: "Breakdown of Lepidoptera records in France by basis of record"

  - user_message: "How many occurrence records of Apis mellifera are there globally?"
    expected_description: "Count of Apis mellifera occurrence records"

  - user_message: "Show me the number of plant specimens collected in Mexico between 2010 and 2020"
    expected_description: "Count of plant specimens from Mexico, 2010-2020"

  - user_message: "How many fungi records are in the United Kingdom by species?"
    expected_description: "Breakdown of fungi records in United Kingdom by species"

  - user_message: "Count reptile observations in Australia"
    expected_description: "Count of reptile observations from Australia"