test_cases:
  - user_message: Find records of Rattus rattus
    expected_param: "taxonKey: 2439270"

  - user_message: Find records of birds in Florida United States
    expected_param: "country: US, stateProvince: Florida, classKey: 212"

  - user_message: Find records of Aves in Florida United States from 2014 to 2016
    expected_param: "country: US, stateProvince: Florida, taxonKey: 212, year: 2014,2016"

  - user_message: Find human observations of honey bees in North America on 2015-08-15
    expected_param: "taxonKey: 1341976, basisOfRecord: HUMAN_OBSERVATION, continent: NORTH_AMERICA, eventDate: 2015-08-15"

  - user_message: Find occurrence records of Panthera leo in South Africa
    expected_param: "country: ZA, taxonKey: 5219404"

  - user_message: Find preserved specimens of Insecta in the United Kingdom
    expected_param: "country: GB, taxonKey: 216, basisOfRecord: PRESERVED_SPECIMEN"

  - user_message: Find records of Felidae in India
    expected_param: "country: IN, taxonKey: 9703"

  - user_message: Find human observations of Aedes aegypti in Brazil in 2019
    expected_param: "country: BR, taxonKey: 1651891, basisOfRecord: HUMAN_OBSERVATION, year: 2019"

  - user_message: Find records of Quercus robur in Germany after 2015
    expected_param: "country: DE, taxonKey: 2878688, year: 2015"

  - user_message: Find preserved specimens of Passer domesticus in Europe between 2000 and 2010
    expected_param: "continent: EUROPE, taxonKey: 5231190, basisOfRecord: PRESERVED_SPECIMEN, year: 2000,2010"